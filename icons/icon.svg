<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Il Jukebox hi-fi: un giradischi visto dall'alto su alluminio champagne. Tutto il disegno sta
       nel cerchio centrale di raggio 76 (la zona sicura delle icone "maskable"). -->
  <defs>
    <linearGradient id="metallo" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f2f0eb"/>
      <stop offset="0.45" stop-color="#d9d5cc"/>
      <stop offset="1" stop-color="#c4c0b6"/>
    </linearGradient>
    <radialGradient id="vinile" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#202023"/>
      <stop offset="1" stop-color="#0b0b0c"/>
    </radialGradient>
    <linearGradient id="tubo" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7f7d78"/>
      <stop offset="0.5" stop-color="#f6f5f1"/>
      <stop offset="1" stop-color="#7f7d78"/>
    </linearGradient>
    <radialGradient id="perno" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#c9c6bf"/>
      <stop offset="1" stop-color="#8d8a84"/>
    </radialGradient>
  </defs>
  <rect width="192" height="192" fill="url(#metallo)"/>
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1">
    <path d="M0 24h192M0 56h192M0 88h192M0 120h192M0 152h192M0 184h192"/>
  </g>
  <!-- pozzo, piatto coi punti stroboscopici, vinile coi solchi -->
  <circle cx="92" cy="100" r="68" fill="#0b0b0c"/>
  <circle cx="92" cy="100" r="64" fill="none" stroke="#c8c5be" stroke-width="5" stroke-dasharray="2.1 2.1"/>
  <circle cx="92" cy="100" r="60" fill="url(#vinile)"/>
  <g fill="none" stroke="#2e2e32" stroke-width="1.3">
    <circle cx="92" cy="100" r="53"/>
    <circle cx="92" cy="100" r="45"/>
    <circle cx="92" cy="100" r="37"/>
  </g>
  <path d="M57 70a46 46 0 0 1 58-17" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="7" stroke-linecap="round"/>
  <!-- etichetta e perno -->
  <circle cx="92" cy="100" r="22" fill="#c4502e"/>
  <circle cx="92" cy="100" r="18" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.2"/>
  <circle cx="92" cy="100" r="3.4" fill="#ece9e2"/>
  <!-- braccio: base, tubo, testina -->
  <circle cx="146" cy="52" r="11" fill="url(#perno)" stroke="#6f6c66" stroke-width="1.2"/>
  <path d="M146 52 L141 112 L126 128" fill="none" stroke="url(#tubo)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="116" y="125" width="15" height="9" rx="2" fill="#26272b" transform="rotate(-45 123.5 129.5)"/>
</svg>
